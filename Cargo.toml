[package]
name = "amity"
version = "0.7.0"
edition = "2024"
authors = ["Zakarum <roman@barykin.me>"]
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/amity"
repository = "https://github.com/zakarumych/amity"
readme = "README.md"
description = "Concurrency algorithms"
keywords = ["concurrency", "algorithms", "lock-free", "wait-free", "no-std"]
categories = ["concurrency", "algorithms", "no-std"]

[features]
std = ["alloc"]
alloc = []
default = ["std"]

spin = ["dep:lock_api"]
ring-buffer = ["alloc"]
flip-queue = ["spin", "ring-buffer"]
triple = []
broad = ["alloc", "spin", "triple"]

[dependencies]
lock_api = { version = "0.5", optional = true }

parking_lot = { version = "0.13", optional = true }

[package.metadata.docs.rs]
all-features = true
